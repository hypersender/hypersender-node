  /sms/v1/{smsInstanceId}/send-message:
    post:
      x-hidden: true
      tags:
        - "Messages"
      summary: "Send Message"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                to:
                  type: "string"
                  description: "Recipient phone number in international format, for example `+12025550147`. Spaces, dashes, dots, and parentheses are removed first. The result must match `^\\+?[0-9]{3,20}$`."
                  example: "+12025550147"
                content:
                  type: "string"
                  maxLength: 1600
                  description: "The SMS text. Up to 1600 characters. Long text is sent as a multipart SMS."
                  example: "Acme code: 482913"
                request_id:
                  type: "string"
                  maxLength: 255
                  description: "Your own ID for this message. Retrying with the same `request_id`, `to`, and `content` returns the existing message with status 200 and does not send it again. If you leave it out, a UUID is generated."
                  example: "order-1042-otp"
                schedule_send_at:
                  type: "string"
                  description: "Send the message later. Format `YYYY-MM-DD HH:MM:SS` in the phone's timezone. Must be in the future and less than 3 days ahead."
                  example: "2026-11-20 09:30:00"
                max_send_attempts:
                  type: "integer"
                  minimum: 1
                  maximum: 15
                  description: "How many times Hypersender tries to push the message to the phone. Defaults to the instance setting."
                  example: 3
                message_expiration_seconds:
                  type: "integer"
                  minimum: 60
                  maximum: 259200
                  description: "How long the message stays valid, in seconds. If the phone has not sent it by then, it expires. Useful for one-time codes. Defaults to the instance setting."
                  example: 600
              required:
                - "to"
                - "content"
            examples:
              Send now:
                value:
                  to: "+12025550147"
                  content: "Acme code: 482913"
                  request_id: "order-1042-otp"
                  message_expiration_seconds: 600
              Schedule:
                value:
                  to: "+12025550147"
                  content: "Your appointment is tomorrow at 10:00."
                  request_id: "appointment-reminder-2231"
                  schedule_send_at: "2026-11-20 09:30:00"
      parameters:
        - name: "smsInstanceId"
          in: "path"
          description: "Instance UUID copied from hypersender dashboard"
          required: true
          schema:
            type: "string"
            example: "{{ instance_id }}"
