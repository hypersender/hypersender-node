            type: "string"
            example: "{{ instance_id }}"
      responses:
        "200":
          description: "Instance restarted successfully"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    example: "WhatsApp instance restarted successfully."
        "404":
          description: "Instance not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseNotFoundError"
        "500":
          description: "Failed to restart instance"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    example: "Failed to restart WhatsApp instance. Please try restarting the instance from hypersender dashboard."
        "429":
          description: "Rate limit exceeded"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    example: "Too many requests. Please try again later."
      security:
        - enterpriseApiKey: []
      x-speakeasy-group: "enterprise"
      x-speakeasy-name-override: "restartInstance"
components:
  securitySchemes:
    whatsappApiKey:
      type: "http"
      scheme: "bearer"
    smsApiKey:
      type: "http"
      scheme: "bearer"
    otpApiKey:
      type: "http"
      scheme: "bearer"
    enterpriseApiKey:
      type: "http"
      scheme: "bearer"
  parameters:
    instance:
      name: "instance"
      in: "path"
      description: "Hypersender instance UUID"
      required: true
      schema:
        type: "string"
      example: "{{ instance_id }}"
  schemas:
    QueuedResponse:
      type: "object"
      description: "All API requests in v2 return a queued response. Use the queued_request_link to check the actual message response."
      properties:
        queued:
          type: "boolean"
          description: "Indicates that the request has been queued"
          example: true
        message:
          type: "string"
          description: "Status message"
          example: "Processing your request..."
        queued_request_uuid:
          type: "string"
          description: "UUID of the queued request"
          example: "a0816120-7e37-4e8b-8cf3-92deb2cdc133"
        queued_request_link:
          type: "string"
          description: "URL to check the status and response of the queued request"
          example: "https://app.hypersender.com/api/whatsapp/v2/{instance}/queued-requests/a0816120-7e37-4e8b-8cf3-92deb2cdc133"
      required:
        - "queued"
        - "message"
        - "queued_request_uuid"
        - "queued_request_link"
    QueuedRequestResponse:
      type: "object"
      description: "Response when checking the status of a queued request"
      properties:
        uuid:
          type: "string"
          description: "UUID of the queued request"
          example: "a0816120-7e37-4e8b-8cf3-92deb2cdc133"
        request:
          type: "object"
          description: "The original request details"
          properties:
            chatId:
              type: "string"
              description: "The chat ID the message was sent to"
              example: "111111111111@c.us"
            text:
              type: "string"
              description: "The message text"
              example: "Hello world!"
        response_status:
          type:
            - "integer"
            - "null"
          description: "HTTP status code of the processed request. Null while the request is still being processed."
          example: 200
        response_body:
          type:
            - "object"
            - "null"
          description: "The actual API response body once the request is processed. Contains the message details when completed, or error details when failed. Null while processing."
          properties:
            message_id:
              type: "string"
              description: "The unique identifier of the sent message"
              example: "AAAAAA0000BBBBB00CCCCCC"
        response_header:
          type:
            - "object"
            - "null"
          description: "The response headers from the processed request. Null while processing."
      required:
        - "uuid"
        - "request"
    SendMessageRequest:
      type: "object"
      properties:
        chatId:
          type: "string"
          description: "Contact number - **learn what is [`chatId`](https://docs.hypersender.com/v2/api-reference/whatsapp/what-is-chatid)**"
          example: "111111111111@c.us"
        text:
          type: "string"
          description: "Text Message\r\n"
        reply_to:
          type: "string"
          description: "Reply to message id\r\n"
        link_preview:
          type: "boolean"
          description: "Link Preview\r\n"
        link_preview_high_quality:
          type: "boolean"
          description: "Link Preview High Quality\r\n"
      required:
        - "chatId"
        - "text"
    SendLinkCustomPreview:
