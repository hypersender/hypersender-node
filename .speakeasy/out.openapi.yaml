paths:
  /whatsapp/v2/{whatsappInstanceId}/queued-requests/{queued_request_uuid}:
    get:
      operationId: "whatsapp-getQueuedRequest"
      tags:
        - "Queued Requests"
      x-hidden: true
      parameters:
        - name: "whatsappInstanceId"
          in: "path"
          description: "Instance UUID copied from hypersender dashboard"
          required: true
          schema:
            type: "string"
            example: "{{ instance_id }}"
          x-speakeasy-globals-hidden: true
        - name: "queued_request_uuid"
          in: "path"
          description: "The UUID of the queued request returned from any API call"
          required: true
          schema:
            type: "string"
            example: "a0816120-7e37-4e8b-8cf3-92deb2cdc133"
      responses:
        "200":
          description: "Queued request details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedRequestResponse"
              examples:
                Successful Message:
                  value:
                    uuid: "a08358c2-b4d6-4cd6-a882-70e606e4b95f"
                    request:
                      text: "Check this https://hypersender.com/"
                      chatId: "2015537361@c.us"
                      session: "4-instance-2598"
                      reply_to: null
                      linkPreview: false
                      linkPreviewHighQuality: false
                    response_status: 201
                    response_body:
                      key:
                        id: "3EB0155CFDC2464F72FD75"
                        fromMe: true
                        remoteJid: "2015537361@s.whatsapp.net"
                      status: "PENDING"
                      message:
                        extendedTextMessage:
                          text: "Check this https://hypersender.com/"
                      messageTimestamp: "1764859906"
                    response_header:
                      date:
                        - "Thu, 04 Dec 2025 14:51:46 GMT"
                      content-type:
                        - "application/json"
                Failed Request:
                  value:
                    uuid: "a08358c2-b4d6-4cd6-a882-70e606e4b95f"
                    request:
                      text: "Hello!"
                      chatId: "invalid@c.us"
                    response_status: 422
                    response_body:
                      message: "The given data was invalid."
                      errors:
                        messages:
                          - "The number you want to send the message to is not on whatsapp."
                        jid: "invalid@s.whatsapp.net"
                        exists: false
                      statusCode: 422
                    response_header:
                      content-type:
                        - "application/json"
        "404":
          description: "Queued request not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
      security:
        - whatsappApiKey: []
      x-speakeasy-group: "whatsapp"
      x-speakeasy-name-override: "getQueuedRequest"
  /whatsapp/v2/{whatsappInstanceId}/send-text-safe:
    post:
      operationId: "whatsapp-sendTextSafe"
      x-hidden: true
      tags:
        - "Send Messages"
      parameters:
        - name: "whatsappInstanceId"
          in: "path"
          description: "Instance UUID copied from hypersender dashboard"
          required: true
          schema:
            type: "string"
            example: "{{ instance_id }}"
          examples:
            default:
              value: "{{ instance_id }}"
          x-speakeasy-globals-hidden: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
            examples:
              Example 1:
                value:
                  chatId: "111111111111@c.us"
                  text: "Hi there!"
                  reply_to: "string"
                  link_preview: false
                  link_preview_high_quality: false
        required: true
      responses:
        "201":
          description: "Request queued successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedResponse"
              examples:
                queued:
                  value:
                    queued: true
                    message: "Processing your request..."
                    queued_request_uuid: "a0816120-7e37-4e8b-8cf3-92deb2cdc133"
                    queued_request_link: "https://app.hypersender.com/api/whatsapp/v2/{instance}/queued-requests/a0816120-7e37-4e8b-8cf3-92deb2cdc133"
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "422":
          description: "Validation Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              examples:
                Multiple fields Error:
                  value:
                    message: "The given data was invalid."
                    errors:
                      messages:
                        - "The number you want to send the message to is not on whatsapp."
                      jid: "20121323124131@s.whatsapp.net"
                      exists: false
                    statusCode: 422
                'Single Field error ':
                  value:
                    message: "The given data was invalid."
                    errors:
                      messages:
                        - "textMessage.text should not be empty"
                    statusCode: 422
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerError"
              examples:
                default:
                  value:
                    message: "Server Error"
                Example 1:
                  value:
                    message: "Server Error"
      security:
        - whatsappApiKey: []
      x-speakeasy-group: "whatsapp"
      x-speakeasy-name-override: "sendTextSafe"
