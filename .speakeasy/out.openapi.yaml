            - "FORCE_UPDATE_REQUIRED"
          description: "Set on `426` responses."
        data:
          type: "object"
          description: "Extra details, for example the app versions on a `426`."
        statusCode:
          type: "integer"
          description: "The HTTP status. Present on errors returned by the SMS service."
      required:
        - "message"
    PaginationLinks:
      type: "object"
      properties:
        first:
          type:
            - "string"
            - "null"
        last:
          type:
            - "string"
            - "null"
        prev:
          type:
            - "string"
            - "null"
        next:
          type:
            - "string"
            - "null"
    PaginationMeta:
      type: "object"
      properties:
        current_page:
          type: "integer"
        from:
          type:
            - "integer"
            - "null"
        last_page:
          type: "integer"
        links:
          type: "array"
          items:
            type: "object"
            properties:
