        length:
          type: "integer"
          description: "Length of the code"
        useLetter:
          type: "boolean"
        useNumber:
          type: "boolean"
        allCapital:
          type: "boolean"
        name:
          type: "string"
          description: "Name to show in messages"
        expires:
          type: "integer"
          description: "TTL in seconds"
      required:
        - "chatId"
    ValidateCodeRequest:
      type: "object"
      properties:
        chatId:
          type: "string"
        code:
          type: "string"
      required:
        - "chatId"
        - "code"
    GenerateLinkRequest:
      type: "object"
      properties:
        chatId:
          type: "string"
          description: "WhatsApp chat ID of the recipient (e.g. 20123456789@c.us)"
        expires:
          type: "integer"
          description: "TTL in seconds"
        name:
          type: "string"
        message:
          type: "object"
          properties:
            prompt:
              type: "string"
            success:
              type: "string"
            failed:
              type: "string"
            expired:
              type: "string"
        callback:
          type: "object"
          properties:
            success:
              type: "string"
            failed:
              type: "string"
      required:
        - "chatId"
    RequestCodeResponse:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        data:
          type: "object"
          properties:
            uuid:
              type: "string"
            chat_id:
              type: "string"
            code:
              type: "string"
            status:
              type: "string"
            otp_type:
              type: "string"
            expires_at:
              type: "string"
              format: "date-time"
            created_at:
              type: "string"
              format: "date-time"
    ValidateCodeResponse:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        data:
          type: "object"
          properties:
            uuid:
              type: "string"
            chat_id:
              type: "string"
            status:
              type: "string"
            validated_at:
              type: "string"
              format: "date-time"
    GenerateLinkResponse:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        data:
          type: "object"
          properties:
            uuid:
              type: "string"
            code:
              type: "string"
            chat_id:
              type: "string"
            status:
              type: "string"
            otp_type:
              type: "string"
            expires_at:
              type: "string"
              format: "date-time"
            created_at:
              type: "string"
              format: "date-time"
            whatsapp_link:
              type: "string"
    CreateInstanceRequest:
      type: "object"
      properties:
        phone:
          type: "string"
          description: "E.164 format phone number (e.g. +201234567890)"
          example: "+201234567890"
        name:
          type: "string"
          description: "Instance name (max 50 characters, must be unique per user per service)"
          example: "MyInstanceName"
          maxLength: 50
        webhook_url:
          type: "string"
          description: "Optional webhook URL (must be a valid https URL)"
          example: "https://yourdomain.com/webhooks/whatsapp"
          format: "uri"
      required:
        - "phone"
        - "name"
    InstanceResponse:
      type: "object"
      properties:
        id:
          type: "string"
          description: "Instance UUID"
          example: "fa3d01c4-1234-4c0d-a12f-df319b612f8c"
        name:
          type: "string"
          description: "Instance name"
          example: "MyInstanceName"
        phone:
          type: "string"
          description: "Phone number in E.164 format"
          example: "+201234567890"
        service_type:
          type: "string"
          description: "Service type"
          example: "whatsapp"
        status:
          type: "string"
          enum:
            - "STOPPED"
            - "STARTING"
            - "WORKING"
            - "SCAN_QR_CODE"
            - "FAILED"
            - "PENDING"
          description: "Instance status"
          example: "WORKING"
        access_token:
          type:
            - "string"
            - "null"
          description: "Access token for the instance"
          example: "234|3uB2pBST2H6If8twXIeUaeNu23VJ8XassYoOVJuva48388e1"
        created_at:
          type: "string"
          description: "Creation timestamp"
          example: "2025-05-26T10:12:45"
    InstanceWithQRResponse:
      allOf:
        - $ref: "#/components/schemas/InstanceResponse"
        - type: "object"
          properties:
            qr_code:
              type: "string"
              description: "Base64-encoded PNG QR code (without data:image/png;base64, prefix). You must prepend it manually when displaying: <img src=\"data:image/png;base64,{{qr_code}}\" />"
              example: "iVBORw0KGgoAAAANSUhEUgAAA..."
    EnterpriseNotFoundError:
      type: "object"
      title: "NotFoundError"
      example:
        message: "Resource not found."
      properties:
        message:
          type: "string"
    EnterpriseValidationError:
      type: "object"
      title: "ValidationError"
      properties:
        message:
          type: "string"
        errors:
          type: "object"
          description: "Invalid or missing fields will be shown here"
        statusCode:
          type: "integer"
          example: 422
      example:
        message: "The given data was invalid."
        errors:
          phone:
            - "The phone field is required."
          name:
            - "The name field is required."
        statusCode: 422
      required:
        - "errors"
        - "statusCode"
    EnterpriseServerError:
      type: "object"
      title: "ServerError"
      properties:
        message:
          type: "string"
      example:
        message: "Internal Server Error"
